<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIND TIA</title>
<style>
@font-face{font-family:Outfit;font-weight:600;font-display:swap;src:url(fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:800;font-display:swap;src:url(fonts/outfit-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}
:root{--fd:Outfit,system-ui,sans-serif;--ink:#0F2A33;--teal:#1FA39A;--sun:#FFC247;--bg:#EEF3F4;--bad:#E4572E;--ink2:#1B3D47;--teal2:#0E7C75}
body[data-t=savane]{--ink:#0D3B2E;--ink2:#12493A;--sun:#F28C28;--teal:#2FA37A;--teal2:#157A5A;--bg:#EDF4EF}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:16px/1.5 Manrope,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:opacity .4s}
body.bye{opacity:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 96px;transform:translateX(9%);opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s}
.scr.on{transform:none;opacity:1;pointer-events:auto}.scr.l{transform:translateX(-9%)}
h1{font:800 32px/1.1 var(--fd);letter-spacing:-1px;margin-bottom:14px}
h3,.mb b,.fab,nav button,#det header b,#vw header b,#dlg h2,.ty,.loc{font-family:var(--fd)}
.mb b{font-weight:600}.fab,.ty{font-weight:800}
#home{overflow:hidden;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.wm{font:800 88px/.92 var(--fd);letter-spacing:-4px}
.wm em{display:inline-block;font-style:normal;position:relative;isolation:isolate;color:var(--ink);padding:0 16px;margin-left:-4px;transform:rotate(-2deg)}
.wm em:before{content:"";position:absolute;inset:8px 0 2px;background:var(--sun);z-index:-1;transform:scaleX(0);transform-origin:left}
.lens{position:absolute;right:-34px;top:calc(env(safe-area-inset-top) + 30px);width:210px;opacity:0;transform:translate(-220px,50px) rotate(-35deg)}
.play .wm em:before{animation:hl .7s .55s cubic-bezier(.2,.8,.2,1) forwards}
.play .lens{animation:ln 1s .1s cubic-bezier(.2,.8,.2,1) forwards}
.lens .f{fill:var(--ink2)}.lens .h{stroke:var(--sun)}.lens .d{fill:var(--sun)}
#hm{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 14px);width:48px;height:48px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;z-index:2}
.ck{position:absolute;left:22px;top:calc(env(safe-area-inset-top) + 84px)}.ck b{display:block;font:800 52px/1 var(--fd);letter-spacing:-2px}.ck span{display:block;opacity:.8;font-size:14px;text-transform:capitalize;margin-top:2px}
.tag{opacity:.85;font-size:19px;line-height:1.4;max-width:290px;margin:18px 0 26px}
.mb{display:block;width:100%;text-align:left;padding:18px 20px;border-radius:22px;background:var(--ink2);margin-top:10px}
.mb[data-go=search]{background:var(--sun);color:var(--ink)}.mb[data-go=search] small{opacity:.8}
.mb b{display:block;font-size:21px}.mb small{opacity:.7}
.mb.q{background:none;border:1.5px solid #ffffff44}
.play .mb,.play .tag{animation:up .55s backwards}
.play .mb:nth-of-type(1){animation-delay:.9s}.play .mb:nth-of-type(2){animation-delay:1s}.play .mb:nth-of-type(3){animation-delay:1.1s}
.mb:active,.chip:active,.fab:active{transform:scale(.97)}
@keyframes hl{to{transform:none}}@keyframes ln{to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(24px)}}
@media(prefers-reduced-motion){*{animation:none!important;transition:none!important}.lens{opacity:1;transform:none}.wm em:before{transform:none}}
.sf{display:flex;align-items:center;background:#fff;border-radius:30px;padding:0 6px 0 20px;box-shadow:0 8px 24px #0f2a331a}
.sf input{flex:1;border:0;outline:0;font:inherit;font-size:18px;padding:15px 0;background:none;min-width:0}
.sf button{width:40px;height:40px;border-radius:50%;font-size:20px;opacity:.5}
.opt{margin:10px 0}.opt summary{cursor:pointer;color:var(--teal);font-weight:600;padding:6px 0}
.panel{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.panel select{font:inherit;padding:9px;border-radius:12px;border:1.5px solid #cbd8db;background:#fff;max-width:100%}
.chip input{display:none}.chip span{display:block;padding:9px 14px;font-weight:600;font-size:14px;border-radius:20px;background:#fff;border:1.5px solid #cbd8db;transition:.2s}
.chip input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
#info{opacity:.7;margin:4px 2px 8px;font-size:14px}
h3{font-size:14px;margin:16px 2px 6px;color:var(--teal);position:sticky;top:-18px;background:var(--bg);padding:6px 0;word-break:break-word}
.res{display:block;width:100%;text-align:left;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 6px 18px #0f2a3314;animation:up .3s backwards}
.res b{display:block;font:600 13px var(--fd);color:var(--teal2);margin-bottom:2px}.res span{display:block;overflow-wrap:anywhere}
mark{background:var(--sun);color:var(--ink);border-radius:3px;padding:0 1px}
.empty{text-align:center;opacity:.65;padding:40px 20px}
.fab{display:block;width:100%;background:var(--sun);font-weight:700;padding:16px;border-radius:30px;margin:6px 0 14px;transition:.15s}
.doc{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;transition:.3s;animation:up .3s backwards}
.doc.out{opacity:0;transform:translateX(60px)}
.doc div{flex:1;min-width:0}.doc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc small{opacity:.6}
.ty{font-style:normal;font-weight:700;font-size:12px;color:#fff;border-radius:10px;padding:10px 6px;min-width:58px;text-align:center;background:#217346}
.ty.Word{background:#2B579A}.ty.PowerPoint{background:#D24726}.ty.Texte{background:#667}
.del{color:var(--bad);font-size:13px;font-weight:600;padding:8px}
.lnk{color:var(--bad);display:block;margin:14px auto;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 22px #0f2a3320;transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:3}
body[data-s=home] nav{transform:translateY(110%)}
nav button{flex:1;padding:16px 4px;font-size:13px;font-weight:600;opacity:.55;position:relative;transition:.2s}
nav button.on{opacity:1;color:var(--teal)}
nav button.on:after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}
#det{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#det.on{transform:none}
:is(#det,#vw) header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 8px 10px}
:is(#det,#vw) header div{flex:1;min-width:0}:is(#det,#vw) header b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}:is(#det,#vw) header small{opacity:.7}
:is(#det,#vw) header button{width:44px;height:44px;font-size:22px;border-radius:50%}
#db{flex:1;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 24px)}
#db.f{animation:up .3s}
.big{font-size:21px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cell{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.cell small{display:block;color:var(--teal);font-weight:700;font-size:12px}
#dlg,#busy{position:fixed;inset:0;background:#0F2A33bb;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:9;padding:24px}
#dlg.on,#busy.on{opacity:1;pointer-events:auto}
#dlg div{background:#fff;border-radius:22px;padding:22px;max-width:340px;transform:scale(.88);transition:.3s cubic-bezier(.2,1.3,.4,1)}
#dlg.on div{transform:none}#dlg p{margin:6px 0 18px;opacity:.75}
#dlg nav{all:unset;display:flex;gap:10px}#dlg nav button{flex:1;padding:13px;border-radius:14px;background:var(--bg);opacity:1;font-size:16px}
#dlg nav #dok{background:var(--ink);color:#fff}#dlg nav #dok.bad{background:var(--bad)}
#busy{color:#fff;font-weight:600;text-align:center}
#busy i{display:block;height:5px;width:200px;margin:14px auto 0;background:#ffffff33;border-radius:5px;overflow:hidden}
#busy i:after{content:"";display:block;height:100%;width:40%;background:var(--sun);animation:sl 1s infinite alternate ease-in-out}
@keyframes sl{from{margin-left:0}to{margin-left:60%}}
.note{background:#FFC24744;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.fx{display:block;font-style:normal;font-family:monospace;font-size:14px;color:#0b6b64;margin-top:4px}
.nt{display:block;font-size:15px;opacity:.8;margin-top:4px}
#vw{position:fixed;inset:0;background:var(--bg);z-index:6;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#vw.on{transform:none}#vs{font:inherit;max-width:42%;padding:8px;border-radius:10px;border:0;background:#ffffff22;color:#fff}#vs option{color:#000}
#vb{flex:1;overflow:auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 24px)}
table{border-collapse:collapse;font-size:15px}td,th{border:1px solid #cbd8db;padding:6px 10px;background:#fff;vertical-align:top;min-width:90px;max-width:280px;overflow-wrap:anywhere;text-align:left}
thead th{position:sticky;top:-12px;background:#dfe8ea;z-index:1}tbody th{position:sticky;left:0;background:#dfe8ea;min-width:44px;text-align:right;z-index:1}
tr.hid td{opacity:.5;background:#f3e8e4}tr.flash td{animation:fl 2.4s}@keyframes fl{0%,70%{background:var(--sun)}}
.blk{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}.blk small{display:block;color:var(--teal);font-weight:700}
.op{color:var(--teal);font-size:13px;font-weight:600;padding:8px}
#mn{position:fixed;inset:0;z-index:8;pointer-events:none}#mn.on{pointer-events:auto}
#mnb{position:absolute;inset:0;background:#0F2A33aa;opacity:0;transition:opacity .3s}#mn.on #mnb{opacity:1}
#mn aside{position:absolute;left:0;top:0;bottom:0;width:80%;max-width:330px;background:#fff;transform:translateX(-102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top) + 22px) 14px 24px;overflow:auto;border-radius:0 26px 26px 0}
#mn.on aside{transform:none}#mn h2{font:800 26px var(--fd);letter-spacing:-.5px;margin:0 8px 14px}
#mn aside button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:15px 14px;border-radius:16px;font:600 18px var(--fd)}
#mn aside button small{font:400 13px Manrope,sans-serif;opacity:.6}#mn aside button:active{background:var(--bg)}
#mn.on aside button{animation:up .4s backwards}#mn.on aside button:nth-of-type(2){animation-delay:.05s}#mn.on aside button:nth-of-type(3){animation-delay:.1s}#mn.on aside button:nth-of-type(4){animation-delay:.15s}#mn.on aside button:nth-of-type(5){animation-delay:.2s}#mn.on aside button:nth-of-type(6){animation-delay:.25s}
#mn aside hr{border:0;border-top:1px solid #dbe5e7;margin:8px 6px}#mn aside .q{color:var(--bad)}
#dm{white-space:pre-line}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--bad);color:#fff;padding:12px 16px;border-radius:14px;z-index:10;transform:translateY(300%);opacity:0;pointer-events:none;transition:.35s}
#toast.on{transform:none;opacity:1}
</style></head>
<body data-s="home">
<section class="scr on" id="home">
  <svg class="lens" viewBox="0 0 64 64" fill="none" stroke-linecap="round" aria-hidden="true"><circle class="f" cx="26" cy="26" r="13.5"/><circle cx="26" cy="26" r="17" stroke="#fff" stroke-width="7"/><path class="h" d="M39 39 56 56" stroke-width="9"/><path d="M26 14.5v2M26 35.5v2M14.5 26h2M35.5 26h2" stroke="#9DB9C0" stroke-width="1.2"/><path id="ch" d="M26 26V19.5" stroke="#fff" stroke-width="2.4"/><path id="cm" d="M26 26V16" stroke="#fff" stroke-width="1.7"/><path id="cs" class="h" d="M26 28.5V14.5" stroke-width="1"/><circle class="d" cx="26" cy="26" r="1.6"/></svg>
  <button id="hm" aria-label="Ouvrir le menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="ck"><b id="ct">--:--</b><span id="cd"></span></div>
  <div class="wm">FIND<br><em>TIA</em></div>
  <p class="tag">Cherchez dans vos fichiers Word, Excel et PowerPoint, sans connexion.</p>
  <button class="mb" data-go="search"><b>Rechercher</b><small>Un mot, un nombre, une phrase</small></button>
  <button class="mb" data-go="docs"><b>Mes documents</b><small id="hc">Aucun document en mémoire</small></button>
  <button class="mb q" data-q><b>Quitter</b><small>Vos documents restent en mémoire</small></button>
</section>
<section class="scr l" id="search">
  <h1>Rechercher</h1>
  <div class="sf"><input id="q" type="search" placeholder="Que cherchez-vous ?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button id="cl" aria-label="Effacer">✕</button></div>
  <details class="opt"><summary>Options de recherche</summary><div class="panel">
    <label class="chip"><input type="checkbox" id="oc"><span>Respecter la casse</span></label>
    <label class="chip"><input type="checkbox" id="ow"><span>Mot entier</span></label>
    <label class="chip"><input type="checkbox" id="oa"><span>Respecter les accents</span></label>
    <label class="chip"><input type="checkbox" id="oh"><span>Ignorer les lignes masquées ou filtrées</span></label>
    <select id="om"><option value="phrase">Expression exacte</option><option value="words">Tous les mots, dans le désordre</option><option value="wild">Jokers : * = plusieurs lettres, ? = une lettre</option><option value="regex">Expression régulière</option></select>
    <select id="os"><option value="all">Tous les documents</option></select>
    <select id="ot" hidden></select>
  </div></details>
  <div id="info"></div><div id="list"></div>
</section>
<section class="scr l" id="docs">
  <h1>Mes documents</h1>
  <button class="fab" id="add">+ Ajouter des fichiers</button>
  <input type="file" id="fi" multiple hidden accept=".xlsx,.xlsm,.xlsb,.xls,.ods,.csv,.docx,.docm,.dotx,.pptx,.pptm,.ppsx,.potx,.txt,.md">
  <div id="dl"></div>
</section>
<nav><button data-go="home">Accueil</button><button data-go="search">Rechercher</button><button data-go="docs">Documents</button><button data-q>Quitter</button></nav>
<div id="mn"><div id="mnb"></div><aside><h2>Menu</h2>
<button data-m="search">Rechercher</button><button data-m="docs">Mes documents<small id="mc"></small></button><button data-m="add">Ajouter des fichiers</button><hr>
<button data-m="theme">Thème<small id="mt"></small></button><button data-m="help">Aide à la recherche</button><button data-m="about">À propos</button><hr><button data-m="quit" class="q">Quitter</button></aside></div>
<div id="det"><header><button id="dx" aria-label="Fermer">←</button><div><b id="dt"></b><small id="dsub"></small></div><button id="dp" aria-label="Précédent">‹</button><button id="dn" aria-label="Suivant">›</button></header><div id="db"></div></div>
<div id="vw"><header><button id="vx" aria-label="Fermer">←</button><div><b id="vt"></b><small id="vsub"></small></div><select id="vs" hidden></select></header><div id="vb"></div></div>
<div id="dlg"><div><h2 id="dtt"></h2><p id="dm"></p><nav><button id="dno">Annuler</button><button id="dok"></button></nav></div></div>
<div id="busy"><div><span id="bt"></span><i></i></div></div>
<div id="toast"></div>
<script src="lib/jszip.min.js"></script><script src="lib/xlsx.full.min.js"></script><script src="app.js"></script>
</body></html>
